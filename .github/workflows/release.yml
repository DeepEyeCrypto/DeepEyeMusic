name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore (Graceful Fallback)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            if [ -s "$RUNNER_TEMP/release-keystore.jks" ]; then
              echo "KEYSTORE_READY=true" >> "$GITHUB_ENV"
              echo "Keystore successfully decoded to transient runner storage."
            else
              echo "::warning::Decoded keystore file is empty! Using debug signing fallback."
              echo "KEYSTORE_READY=false" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::Keystore secrets not configured. Using debug signing fallback for release artifacts."
            echo "KEYSTORE_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Secure Shred Keystore
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release-keystore.jks" ]; then
            shred -u -z "$RUNNER_TEMP/release-keystore.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/release-keystore.jks"
            echo "Keystore securely purged from runner storage."
          fi

      - name: Generate Checksums
        run: |
          cd app/build/outputs
          mkdir -p release_artifacts
          cp apk/release/*.apk release_artifacts/ 2>/dev/null || true
          cp bundle/release/*.aab release_artifacts/ 2>/dev/null || true
          cd release_artifacts
          sha256sum * > checksums.sha256
          echo "Generated SHA-256 Checksums:"
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/release_artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
